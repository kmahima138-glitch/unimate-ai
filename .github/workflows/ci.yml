name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure isolated test data
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/unimate-test-data" >> "$GITHUB_ENV"
          echo "DB_URL=sqlite:///$RUNNER_TEMP/unimate-test-data/unimate.db" >> "$GITHUB_ENV"
          echo "UPLOAD_DIR=$RUNNER_TEMP/unimate-test-data/uploads" >> "$GITHUB_ENV"
          echo "CHROMA_PERSIST_DIR=$RUNNER_TEMP/unimate-test-data/chromadb" >> "$GITHUB_ENV"

      - name: Generate sample documents
        run: python -m backend.scripts.generate_sample_docs

      - name: Seed test database
        run: python -m backend.scripts.seed_knowledge_base

      - name: Run tests
        run: python -m pytest backend/tests/ -v
