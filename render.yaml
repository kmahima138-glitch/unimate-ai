services:
  - type: web
    name: unimate-ai
    env: python
    buildCommand: pip install -r requirements.txt && python backend/scripts/seed_knowledge_base.py
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: unimate-data
      mountPath: /app/data
      sizeGB: 1
